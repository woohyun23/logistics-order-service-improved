spring:
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
    discovery:
      client:
        simple:
          instances:
            company-product-service:
              - uri: ${PRODUCT_SERVICE_URL:http://localhost:18080}
            delivery-service:
              - uri: ${DELIVERY_SERVICE_URL:http://localhost:18080}
            hub-service:
              - uri: ${HUB_SERVICE_URL:http://localhost:18080}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics_order}
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:order}
    hikari:
      pool-name: order-performance-pool
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        use_sql_comments: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:order}
    password: ${RABBITMQ_PASSWORD:order}
    listener:
      simple:
        concurrency: ${RABBITMQ_CONSUMER_CONCURRENCY:4}
        max-concurrency: ${RABBITMQ_CONSUMER_MAX_CONCURRENCY:16}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: false
    sampling:
      probability: 0.0

message:
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:5000}
    initial-delay-ms: ${OUTBOX_INITIAL_DELAY_MS:0}
    skip-locked-enabled: ${OUTBOX_SKIP_LOCKED_ENABLED:true}
  external-query-cache:
    fallback-enabled: ${CACHE_FALLBACK_ENABLED:true}
    product-ttl-seconds: ${PRODUCT_CACHE_TTL_SECONDS:300}
    delivery-status-ttl-seconds: ${DELIVERY_CACHE_TTL_SECONDS:30}

logging:
  level:
    com.sparta.logistics.application.command.service.OutboxEventPublisher: warn
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off
    org.springframework.amqp.rabbit.listener: warn
